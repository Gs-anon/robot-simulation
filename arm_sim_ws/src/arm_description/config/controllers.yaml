# =============================================================================
#  Gazebo / ros2_control 控制器配置（enable_gazebo: true 时使用）
#  注意：joints 列表里的名字必须和 arm_config.yaml 里的关节名一一对应。
# =============================================================================

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    interface_name: position
