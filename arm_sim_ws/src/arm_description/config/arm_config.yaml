# =============================================================================
#  机械臂「状态机式」参数配置
# =============================================================================
#  思路：把机械臂看成一条「状态链」。states 里的每一项就是一个状态
#  （一个关节 + 它带动的那根连杆），列表从上到下的顺序 = 从基座到末端的
#  装配顺序，也就是你要改的「轴序」。改顺序、增删状态、改参数都非常直观。
#
#  ┌──────────┬──────────┬──────────┬─────┬──────────┐
#  │ joint_1  │ joint_2  │ joint_3  │ ... │ tool0    │
#  │  (state) │  (state) │  (state) │     │ (末端)   │
#  └──────────┴──────────┴──────────┴─────┴──────────┘
#      ↑ 列表顺序 = 轴序，第一项连在 base_link 上，依次向后串
#
# -----------------------------------------------------------------------------
#  约定 convention（二选一）
# -----------------------------------------------------------------------------
#   urdf   —— 直接写关节 axis（转轴向量）和 origin（偏置 xyz + 姿态 rpy）。
#             适合你心里已经想好了每个关节相对父坐标系的位姿。
#
#   dh_std —— 标准 DH 参数 (a, alpha, d, theta)，自动换算成 URDF。
#             适合你有现成的 DH 表。theta 是关节变量，这里填初值（弧度）。
#
#   dh_mod —— 改进 DH 参数（Craig 约定），换算规则与标准 DH 不同。
#
#   DH 参数含义速查：
#     a      —— 连杆长度：沿 X_{i-1} 方向，Z_{i-1} 到 Z_i 的距离（米）
#     alpha  —— 连杆扭转：绕 X_{i-1} 轴，Z_{i-1} 转到 Z_i 的角度（弧度）
#     d      —— 关节偏置：沿 Z_i 轴方向，X_{i-1} 到 X_i 的距离（米）
#     theta  —— 关节角：绕 Z_{i-1} 轴，X_{i-1} 转到 X_i 的角度（弧度）
# -----------------------------------------------------------------------------
#  注意：link 里的 geometry 只影响「显示/碰撞」形状（外观），
#        真正的运动学尺寸由上面的 DH 参数（a、d、alpha）决定。
# -----------------------------------------------------------------------------

robot_name: my_arm
convention: dh_std          # 可选：urdf | dh_std | dh_mod
enable_gazebo: false        # true 时额外生成 Gazebo/ros2_control 接口（需装 gazebo_ros）

# -----------------------------------------------------------------------------
#  基座连杆（固定，无关节）
# -----------------------------------------------------------------------------
base_link:
  name: base_link
  geometry: {shape: box, size: [0.20, 0.20, 0.06]}
  material: {r: 0.35, g: 0.35, b: 0.35, a: 1.0}
  mass: 5.0

# -----------------------------------------------------------------------------
#  末端工具（可选，固定连接在最后一个连杆上）
# -----------------------------------------------------------------------------
tool_link:
  name: tool0
  origin: {xyz: [0.0, 0.0, 0.12], rpy: [0.0, 0.0, 0.0]}   # 末端工具偏置
  geometry: {shape: sphere, radius: 0.02}
  material: {r: 1.0, g: 0.0, b: 0.0, a: 1.0}
  mass: 0.1

# -----------------------------------------------------------------------------
#  状态链：每个状态 = 一个关节 + 一根连杆（这里以 6 轴机械臂为例）
# -----------------------------------------------------------------------------
states:

  # ---------------- 状态 1：腰部回转 ----------------
  - name: joint_1
    type: revolute            # revolute(旋转) | continuous(无限旋转) | prismatic(移动) | fixed(固定)
    dh: {a: 0.0, alpha: 1.5708, d: 0.35, theta: 0.0}
    limits: {lower: -3.14159, upper: 3.14159, effort: 100.0, velocity: 2.0}
    link:
      name: link_1
      geometry: {shape: cylinder, radius: 0.07, length: 0.15}
      material: {r: 0.20, g: 0.50, b: 0.80, a: 1.0}
      mass: 2.0

  # ---------------- 状态 2：大臂俯仰 ----------------
  - name: joint_2
    type: revolute
    dh: {a: 0.35, alpha: 0.0, d: 0.0, theta: 0.0}
    limits: {lower: -2.3562, upper: 2.3562, effort: 100.0, velocity: 2.0}
    link:
      name: link_2
      geometry: {shape: cylinder, radius: 0.06, length: 0.40}
      material: {r: 0.20, g: 0.65, b: 0.45, a: 1.0}
      mass: 4.0

  # ---------------- 状态 3：小臂俯仰 ----------------
  - name: joint_3
    type: revolute
    dh: {a: 0.0, alpha: 1.5708, d: 0.0, theta: 0.0}
    limits: {lower: -2.9671, upper: 2.9671, effort: 80.0, velocity: 3.0}
    link:
      name: link_3
      geometry: {shape: cylinder, radius: 0.05, length: 0.15}
      material: {r: 0.85, g: 0.60, b: 0.20, a: 1.0}
      mass: 1.5

  # ---------------- 状态 4：小臂回转 ----------------
  - name: joint_4
    type: revolute
    dh: {a: 0.0, alpha: -1.5708, d: 0.35, theta: 0.0}
    limits: {lower: -3.14159, upper: 3.14159, effort: 50.0, velocity: 3.0}
    link:
      name: link_4
      geometry: {shape: cylinder, radius: 0.05, length: 0.40}
      material: {r: 0.75, g: 0.40, b: 0.20, a: 1.0}
      mass: 1.5

  # ---------------- 状态 5：腕部俯仰 ----------------
  - name: joint_5
    type: revolute
    dh: {a: 0.0, alpha: 1.5708, d: 0.0, theta: 0.0}
    limits: {lower: -2.0944, upper: 2.0944, effort: 30.0, velocity: 3.0}
    link:
      name: link_5
      geometry: {shape: cylinder, radius: 0.04, length: 0.12}
      material: {r: 0.60, g: 0.30, b: 0.55, a: 1.0}
      mass: 0.8

  # ---------------- 状态 6：腕部回转（末端） ----------------
  - name: joint_6
    type: revolute
    dh: {a: 0.0, alpha: 0.0, d: 0.10, theta: 0.0}
    limits: {lower: -3.14159, upper: 3.14159, effort: 20.0, velocity: 3.0}
    link:
      name: link_6
      geometry: {shape: cylinder, radius: 0.03, length: 0.10}
      material: {r: 0.45, g: 0.45, b: 0.50, a: 1.0}
      mass: 0.5


